name: Bunk Budget notify

on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST daily
    - cron: '30 17 * * *'  # 23:00 IST daily
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: macos-14  # newton-mcp only ships a darwin/arm64 binary
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Newton credentials
        run: |
          mkdir -p "$HOME/.newton-mcp"
          printf '%s' "$NEWTON_CREDENTIALS_JSON" > "$HOME/.newton-mcp/credentials.json"
          chmod 600 "$HOME/.newton-mcp/credentials.json"
        env:
          NEWTON_CREDENTIALS_JSON: ${{ secrets.NEWTON_CREDENTIALS_JSON }}

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_DEADLINES: ${{ (github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
        run: python3 notify.py
