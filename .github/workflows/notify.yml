name: Bunk Budget notify

# Automatic `schedule` triggers are disabled: Newton's API has been
# durably blocking requests from GitHub's shared runner IPs (~45%+
# failure rate, persisting even after hours of cooldown), while a
# direct connection from a home network hits 0% failures. A local
# Claude scheduled task is the primary path now; this workflow stays
# available for manual testing (workflow_dispatch) in case GitHub's
# IP situation improves.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: macos-14  # newton-mcp only ships a darwin/arm64 binary
    steps:
      - uses: actions/checkout@v4

      - name: Determine slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "30 2 * * *"|"45 2 * * *"|"0 3 * * *")
              echo "slot=morning" >> "$GITHUB_ENV" ;;
            "30 17 * * *"|"45 17 * * *"|"0 18 * * *")
              echo "slot=evening" >> "$GITHUB_ENV" ;;
            *)
              echo "slot=" >> "$GITHUB_ENV" ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Newton credentials
        run: |
          mkdir -p "$HOME/.newton-mcp"
          printf '%s' "$NEWTON_CREDENTIALS_JSON" > "$HOME/.newton-mcp/credentials.json"
          chmod 600 "$HOME/.newton-mcp/credentials.json"
        env:
          NEWTON_CREDENTIALS_JSON: ${{ secrets.NEWTON_CREDENTIALS_JSON }}

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT: ${{ env.slot }}
          CHECK_DEADLINES: ${{ (env.slot == 'morning' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
        run: python3 notify.py

      - name: Persist send state
        run: |
          if [ -n "$(git status --porcelain state.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Record successful send [skip ci]"
            git push
          fi
