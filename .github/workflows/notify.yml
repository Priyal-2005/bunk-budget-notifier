name: Bunk Budget notify

# Runs on ubuntu-latest with a pure-HTTP client (notify_http.py), not
# the official npx binary — that binary only ships for darwin/arm64,
# forcing macos-14 runners, and Newton's API was durably blocking
# requests from that specific runner pool. The HTTP client was built
# by capturing and verifying the official tool's real traffic (not
# guessed), and Ubuntu runners are a much larger, different IP pool —
# worth testing whether that dodges the block.
on:
  schedule:
    - cron: '30 2 * * *'   # 08:00 IST
    - cron: '30 17 * * *'  # 23:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine slot
        run: |
          case "${{ github.event.schedule }}" in
            "30 2 * * *")
              echo "slot=morning" >> "$GITHUB_ENV" ;;
            "30 17 * * *")
              echo "slot=evening" >> "$GITHUB_ENV" ;;
            *)
              echo "slot=" >> "$GITHUB_ENV" ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Newton credentials
        run: |
          mkdir -p "$HOME/.newton-mcp"
          printf '%s' "$NEWTON_CREDENTIALS_JSON" > "$HOME/.newton-mcp/credentials.json"
          chmod 600 "$HOME/.newton-mcp/credentials.json"
        env:
          NEWTON_CREDENTIALS_JSON: ${{ secrets.NEWTON_CREDENTIALS_JSON }}

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT: ${{ env.slot }}
          CHECK_DEADLINES: ${{ (env.slot == 'morning' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
        run: python3 notify_http.py

      - name: Persist send state
        run: |
          if [ -n "$(git status --porcelain state.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Record successful send [skip ci]"
            git push
          fi
