name: Bunk Budget notify

# Automatic `schedule` triggers are disabled. Confirmed both GitHub's
# macOS and Ubuntu runner pools get blocked by Newton's API (403,
# instantly, even with completely different request fingerprints —
# the official npx binary vs. this repo's own pure-HTTP client). This
# points to a network-level block on datacenter/CI IP ranges broadly,
# not something specific to one runner pool or client. A Claude
# scheduled task (not tied to a flagged IP range) is the real primary
# now. This workflow is kept for manual testing only, in case the
# block situation changes.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine slot
        run: |
          case "${{ github.event.schedule }}" in
            "30 2 * * *")
              echo "slot=morning" >> "$GITHUB_ENV" ;;
            "30 17 * * *")
              echo "slot=evening" >> "$GITHUB_ENV" ;;
            *)
              echo "slot=" >> "$GITHUB_ENV" ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Newton credentials
        run: |
          mkdir -p "$HOME/.newton-mcp"
          printf '%s' "$NEWTON_CREDENTIALS_JSON" > "$HOME/.newton-mcp/credentials.json"
          chmod 600 "$HOME/.newton-mcp/credentials.json"
        env:
          NEWTON_CREDENTIALS_JSON: ${{ secrets.NEWTON_CREDENTIALS_JSON }}

      - name: Run notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT: ${{ env.slot }}
          CHECK_DEADLINES: ${{ (env.slot == 'morning' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
        run: python3 notify_http.py

      - name: Persist send state
        run: |
          if [ -n "$(git status --porcelain state.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Record successful send [skip ci]"
            git push
          fi
